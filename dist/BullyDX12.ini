; =============================================================================
;  BullyDX12 - Direct3D 9 -> Direct3D 12 (D3D9On12) renderer for Bully SE
;  Log: BullyDX12.log (game folder)
; =============================================================================

[Renderer]
Backend=D3D9On12
ExternalDll=
Adapter=HighPerformance
FallbackToNative=1
D3D12DebugLayer=0
GPUBasedValidation=0
PostProcessing=1

[Display]
VSync=0
Mode=Borderless
Resolution=Game
DpiAware=1

[Shaders]
Dump=0
Override=1
DumpDirectory=BullyDX12\shaders\dump
OverrideDirectory=BullyDX12\shaders\override

[Extensions]
Enabled=1
Directory=BullyDX12\extensions
Load=*

[PostFX]
Enabled=1
Priority=500
Sharpen=0.35
Saturation=1.05
Vibrance=0.10
Contrast=1.03
Vignette=0.15
Gamma=1.0

[RaytracingBridge]
RtScale=2
Enabled=1
SunShadows=1
RtLightStrength=1.0
MinimumLight=0.04
SunIntensity=1
HitBakedRadiance=0.0
SkyIntensity=1
GiStrength=1.5
ReflectionStrength=1
SunAngleDegrees=0.6
DenoisingRange=1000
SunFromShader=1
InvertShaderSunDirection=1
SunDirection=0.3,0.4,0.85
MatrixOrientation=-1
MinSceneDraws=20
MaxNewMeshesPerFrame=64
RetainFrames=10800
RetainRadius=800
EvictAfterFrames=14400
MinPrimitives=2
TraceFrame=0

[Raytracing]
Enabled=1
WorldMatrixRegister=-1
WorldMatrixColumnMajor=1
MaxInstances=16384
MaxBlasBuildsPerFrame=48
EvictAfterFrames=900
MinPrimitives=2
StatsIntervalFrames=1800

[Culling]
GameFrustum=0
OwnFrustum=1
RetainFrames=8
DrawDistance=2.0
PoolScale=0
GameHeapMB=256

[Log]
Level=Info

[Light]
Brightness=0.65
BounceColor=1.5
VolumetricStrength=5
VolumetricOutdoor=2.5
WindowPower=0
LampFalloff=0.02
LampReach=80
GameLightPower=1
GameLightAmbient=0.4
GameLightMaxRadius=80
OwnSystem=1
GameLamps=1
GameLampPower=3
GameLampReach=1.5
LampsOnHour=18
LampsOffHour=7
CarLightPower=1.5
TextureLamps=0
FixturePower=1
FixtureReach=15
EmitLampMin=99
EmitGlow=2.0
EmitLampPower=3.0
GameLightNearLamp=0.2
BakedLampPools=0.8
TimeOfDay=13
DayLengthMinutes=24
ClockPaused=1
SunAzimuthDegrees=35
SunTiltDegrees=35
MoonIntensity=1
CloudCoverage=0.45
CloudSteps=16
CloudBottom=900
CloudTop=1700
FollowGameClock=1

[RTOptions]
Volumetric=1
Denoiser=0
RayTracing=1
Reflections=1
SunShadows=1
LocalShadows=1
Lighting=2
[Exposure]
Max=8
Min=0.5
